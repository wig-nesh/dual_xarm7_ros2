calibration_name: xarm1_cam1

camera:
  image_topic: /camera/camera/color/image_raw
  camera_info_topic: /camera/camera/color/camera_info
  optical_frame: camera_color_optical_frame

board:
  squares_x: 5
  squares_y: 5
  square_length_m: 0.0246
  marker_length_m: 0.0175
  dictionary: DICT_4X4_50
  marker_frame: charuco_board

handeye:
  calibration_type: eye_on_base
  robot_base_frame: link_base
  robot_effector_frame: link_tcp

table_marker:
  marker_type: aruco
  dictionary: DICT_ARUCO_ORIGINAL
  marker_id: 102
  marker_length_m: 0.1775
  marker_frame: table_marker
  hover_offset_m: 0.05
  hover_corner: top_left
  hover_orientation: down
