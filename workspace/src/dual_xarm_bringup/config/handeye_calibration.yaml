sampling:
  tilt_steps_deg: [20.0, 40.0, 60.0]
  azimuth_count: 8
  roll_steps_deg: [-60.0, 0.0, 60.0]
  target_samples: 12
  max_joint_displacement_rad: 2.5
  tf_max_age_sec: 2.0
  settle_time_sec: 0.75
  marker_wait_timeout_sec: 8.0
